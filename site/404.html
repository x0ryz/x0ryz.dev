<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon-winter.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
  <canvas class="season-bg" aria-hidden="true"></canvas>
  <main>
    <header class="intro lost">
      <h1>404</h1>
      <div class="intro-bottom">
        <div class="intro-text">
          <p>This page went for a soak and hasn’t come back.</p>
          <p class="links"><a href="/">Back to the home page</a></p>
        </div>
        <div class="monkey3d"></div>
      </div>
    </header>
  </main>
  <script type="module">
    // The scene is decoration, so it loads once the page has settled
    const load = () => import("/monkey.min.js");
    "requestIdleCallback" in window ? requestIdleCallback(load, { timeout: 2000 }) : setTimeout(load, 300);
  </script>
  <script src="/season.js"></script>
